[package]
name = "phone-media-backup-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[[bin]]
name = "p2r"
path = "src/main.rs"

[lib]
name = "phone_media_backup_rs"
path = "src/lib.rs"

[dependencies]
ssh2 = "0.9.5"
chrono = "0.4.31"
kamadak-exif = "0.6.1"
regex = "1.10.3"
filetime = "0.2"
serde_json = "1.0.116"
serde = { version = "1", features = ["derive"] }
indicatif = "0.18"
clap = { version = "4.5.6", features = ["derive"] }
reqwest = {version="0.13.3", features = ["blocking", "json"] }
confy = {version="2.0.0", features = ["yaml_conf"],default-features = false}
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
anyhow = "1.0.102"
thiserror = "2"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tracing-indicatif = "0.3.9"
once_cell = "1.21.4"
base64 = "0.22"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
httpmock = "0.8.3"
