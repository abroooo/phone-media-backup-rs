[licenses]
version = 2
allow = [
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.9
exceptions = []

[advisories]
unmaintained = "transitive"
yanked = "deny"

# RUSTSEC-2024-0449: unsafe-libyaml is unmaintained, pulled in transitively by
# confy -> serde_yaml. No safe upgrade exists. It is an unmaintained advisory,
# not a known vulnerability, and the only YAML this binary parses is the local
# config file authored by the operator. Revisit when confy drops serde_yaml.
ignore = ["RUSTSEC-2024-0449"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
